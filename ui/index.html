<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Aura-Ctrl</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="overlay"></div>

<div class="container">

    <!-- LOGO -->
    <div class="logo">
        <svg width="80" height="80" viewBox="0 0 100 100">
            <defs>
                <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#6a5acd"/>
                    <stop offset="100%" stop-color="#00e5ff"/>
                </linearGradient>
            </defs>
            <circle cx="50" cy="50" r="45" stroke="url(#grad)" stroke-width="6" fill="none"/>
            <path d="M50 25 L65 60 L50 52 L35 60 Z" fill="url(#grad)"/>
        </svg>
    </div>

    <!-- HEADING -->
    <h1 class="title">
        <span class="aura">Aura</span><span class="ctrl">Ctrl</span>
    </h1>

    <p class="tagline">Control your world with gestures and voice </p>

    <!-- BUTTONS -->
    <div class="buttons">

        <button id="gestureBtn" onclick="toggleGesture()">Start Gesture Mode</button>
<button id="voiceBtn" onclick="toggleVoice()">Start Voice Mode</button>
<button id="bothBtn" onclick="toggleBoth()">Start Both Modes</button>
<button onclick="pywebview.api.open_help()">Help</button>
    <!-- <button onclick="pywebview.api.start_gesture()">Gesture Control</button>
    <button onclick="pywebview.api.start_volume()">Voice Based Control</button>
    <button onclick="pywebview.api.start_both()">Gesture and Voice Control</button>
      -->
     
    </div>

</div>
<script>
let gestureRunning = false;
let voiceRunning = false;
let bothRunning = false;

function setStart(btn, text) {
    btn.innerText = text;
    btn.classList.remove("stop");
    btn.classList.add("start");
}

function setStop(btn, text) {
    btn.innerText = text;
    btn.classList.remove("start");
    btn.classList.add("stop");
}

function resetButtons() {
    gestureRunning = false;
    voiceRunning = false;
    bothRunning = false;

    setStart(document.getElementById("gestureBtn"), "Start Gesture Mode");
    setStart(document.getElementById("voiceBtn"), "Start Voice Mode");
    setStart(document.getElementById("bothBtn"), "Start Both Modes");
}

async function toggleGesture() {
    const btn = document.getElementById("gestureBtn");

    if (!gestureRunning) {
        resetButtons();
        resetColors();   // ✅ reset all colors

        await window.pywebview.api.start_gesture();
        gestureRunning = true;

        btn.innerText = "Stop Gesture Mode";
        btn.style.background = "red";   // ✅ make red
    } else {
        await window.pywebview.api.stop_gesture();
        gestureRunning = false;

        btn.innerText = "Start Gesture Mode";
        btn.style.background = "linear-gradient(135deg, #6a5acd, #00e5ff)"; // back to default
    }
}

async function toggleVoice() {
    const btn = document.getElementById("voiceBtn");

    if (!voiceRunning) {
        resetButtons();
        resetColors();   // 🔥 reset colors

        await window.pywebview.api.start_voice();
        voiceRunning = true;

        btn.innerText = "Stop Voice Mode";
        btn.style.background = "red";   // ✅ FIXED
    } else {
        await window.pywebview.api.stop_voice();
        voiceRunning = false;

        btn.innerText = "Start Voice Mode";
        btn.style.background = "linear-gradient(135deg, #6a5acd, #00e5ff)";
    }
}

async function toggleBoth() {
    const btn = document.getElementById("bothBtn");

    if (!bothRunning) {
        resetButtons();
        resetColors();   // ✅ reset all colors

        await window.pywebview.api.start_both();
        bothRunning = true;

        btn.innerText = "Stop Both Modes";
        btn.style.background = "red";   // ✅ make red
    } else {
        await window.pywebview.api.stop_both();
        bothRunning = false;

        btn.innerText = "Start Both Modes";
        btn.style.background = "linear-gradient(135deg, #6a5acd, #00e5ff)";
    }
}   

function resetColors() {
    const defaultBg = "linear-gradient(135deg, #6a5acd, #00e5ff)";

    document.getElementById("gestureBtn").style.background = defaultBg;
    document.getElementById("voiceBtn").style.background = defaultBg;
    document.getElementById("bothBtn").style.background = defaultBg;
}
</script>
</body>
</html>
